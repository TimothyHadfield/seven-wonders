<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>7 Wonders Lab</title>
<meta name="description" content="Play 7 Wonders against measured computer players, with live draft odds, a score calculator and a study mode.">
<meta name="theme-color" content="#0f1117">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #0f1117; --bg-soft: #161923; --card: #1a1e2b; --line: #2a3042;
    --text: #e8eaf0; --muted: #969db4; --accent: #6ea8fe; --accent-warm: #f0b354;
    --good: #6ee7a8; --bad: #f08c8c;
    --c-brown: #8a5a32; --c-grey: #8d93a3; --c-blue: #3f7fd0; --c-yellow: #e2b33c; --c-red: #cf4b41; --c-green: #3d9a5d; --c-purple: #8a58b8;
    --radius: 12px; --tabbar: 58px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); overflow: hidden;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button, input, select { font: inherit; color: inherit; }
  #app { height: 100dvh; display: flex; flex-direction: column; overflow-x: clip; }
  .view { display: none; flex: 1; min-height: 0; padding: 8px 10px 6px; }
  .view.on { display: flex; flex-direction: column; }

  /* ------------------------------------------------ tabs: phone bottom, laptop top */
  nav.tabs { order: 2; height: calc(var(--tabbar) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    display: flex; background: #12151e; border-top: 1px solid var(--line); flex: none; }
  nav.tabs button { flex: 1; background: none; border: 0; color: var(--muted); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 600; cursor: pointer; }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button.on { color: var(--accent); }
  nav.tabs .brand { display: none; }
  @media (min-width: 900px) {
    nav.tabs { order: 0; height: 52px; padding: 0 16px; border-top: 0; border-bottom: 1px solid var(--line); justify-content: flex-start; gap: 6px; }
    nav.tabs .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 17px; margin-right: 22px; color: var(--text); text-decoration: none; }
    nav.tabs .brand svg { width: 26px; height: 26px; }
    nav.tabs button { flex: none; flex-direction: row; font-size: 14px; padding: 0 14px; gap: 8px; border-radius: 9px; height: 38px; align-self: center; }
    nav.tabs button.on { background: rgba(110,168,254,.12); }
    nav.tabs button svg { width: 18px; height: 18px; }
    .view { padding: 14px 18px; }
  }

  /* ------------------------------------------------ common */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; cursor: pointer; font-weight: 650;
    transition: background .12s, transform .08s, border-color .12s, opacity .12s; white-space: nowrap; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:disabled { opacity: .38; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0d1424; }
  .btn.warm { background: var(--accent-warm); border-color: var(--accent-warm); color: #24180a; }
  .btn.ghost { background: transparent; }
  .btn.small { min-height: 34px; padding: 0 11px; font-size: 13.5px; border-radius: 8px; }
  .btn small { font-weight: 500; opacity: .85; font-size: 12px; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; min-height: 42px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-weight: 650; font-size: 14px; padding: 3px 4px; }
  .seg button[aria-pressed="true"] { background: rgba(110,168,254,.14); border-color: var(--accent); color: var(--accent); }
  .seg button small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
  .seg.sm button { min-height: 38px; font-size: 13px; }
  .row > .seg:only-child { flex: 1; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .label { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .q { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg-soft); color: var(--muted);
    font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; vertical-align: middle; flex: none; }
  .pop { position: fixed; z-index: 60; max-width: min(320px, calc(100vw - 32px)); background: #232838; border: 1px solid #3a4258; border-radius: 10px;
    padding: 10px 12px; font-size: 13.5px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #2f3548; border-radius: 14px; transition: background .15s; cursor: pointer; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; }
  .num { font-variant-numeric: tabular-nums; font-weight: 750; }
  .txt { font-size: 16px; background: var(--bg-soft); color: var(--text); border: 1px solid var(--line); border-radius: 8px; min-height: 42px; padding: 0 12px; width: 100%; min-width: 0; }
  .txt.code { text-transform: uppercase; letter-spacing: .2em; font-weight: 700; flex: 1; }
  select { background: var(--bg-soft); color: var(--text); border: 1px solid var(--line); border-radius: 8px; min-height: 34px; padding: 0 8px; max-width: 100%; }

  /* ------------------------------------------------ icons */
  .ic { width: 16px; height: 16px; flex: none; display: inline-block; vertical-align: middle; }
  .ic.s { width: 12px; height: 12px; }
  .coin { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 35%, #ffe38a, #d9a51f); color: #3a2a00; font-size: 10px; font-weight: 850; border: 1px solid #a07a12; vertical-align: middle; line-height: 1; }
  .vp { display: inline-flex; align-items: center; justify-content: center; min-width: 17px; height: 17px; padding: 0 3px; border-radius: 4px; flex: none;
    background: #3f7fd0; color: #fff; font-size: 10.5px; font-weight: 850; vertical-align: middle; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
  .cchip { display: inline-block; width: 10px; height: 13px; border-radius: 2px; vertical-align: middle; flex: none; }
  .alt, .trade, .per { display: inline-flex; align-items: center; gap: 1px; }
  .alt b, .per b { font-size: 9px; color: #333; font-weight: 800; margin: 0 1px; }
  .who { font-size: 7px; letter-spacing: -1px; color: #333; }
  .tag { font-size: 9.5px; font-weight: 750; background: rgba(0,0,0,.12); padding: 1px 4px; border-radius: 4px; white-space: nowrap; }

  /* ------------------------------------------------ cards */
  .card { position: relative; flex: none; width: 49px; height: 134px; border-radius: 7px; overflow: hidden; display: flex; flex-direction: column;
    background: #efe6d2; color: #1d1d22; border: 1.5px solid #c9bfa6; cursor: pointer; user-select: none;
    background-image: linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,0) 45%, rgba(0,0,0,.07));
    box-shadow: 0 2px 6px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.35), inset 0 0 0 3px rgba(0,0,0,.06);
    transition: transform .16s ease, box-shadow .16s, outline-color .16s, opacity .16s, filter .16s; outline: 2px solid transparent; outline-offset: 1px; }
  .card:active { transform: translateY(-3px) scale(.98); }
  .card .cst.many .ic.s { width: 9px; height: 9px; }
  .card .cst.many .coin { width: 9px; height: 9px; font-size: 6.5px; }
  .card .band { min-height: 18px; flex: none; display: flex; align-items: center; padding: 0 2px; }
  .card .cst { display: flex; flex-wrap: wrap; gap: 0; align-items: center; background: rgba(255,255,255,.88); border-radius: 4px; padding: 0 1px; min-height: 13px; }
  .card .cst .coin { width: 12px; height: 12px; font-size: 8px; }
  .card .free { font-size: 8.5px; font-weight: 750; padding: 0 2px; color: #555; }
  .card .nm { font-size: 9.6px; font-weight: 800; text-align: center; line-height: 1.05; padding: 3px 1px 1px; min-height: 24px; overflow-wrap: normal; -webkit-hyphens: manual; hyphens: manual; display: flex; align-items: center; justify-content: center; }
  .card .ef { flex: 1; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 2px 1px; padding: 1px 1px 12px;
    background: radial-gradient(closest-side, rgba(255,255,255,.6), rgba(255,255,255,0)); }
  .card .ef .ic { width: 22px; height: 22px; }
  .card .ef .coin { width: 20px; height: 20px; font-size: 12px; }
  .card .ef .vp { min-width: 22px; height: 22px; font-size: 13.5px; }
  .card .ef .trade .ic, .card .ef .per .ic, .card .ef .alt .ic { width: 13px; height: 13px; }
  .card .ef .alt, .card .ef .trade, .card .ef .per { flex-wrap: wrap; justify-content: center; max-width: 100%; row-gap: 2px; }
  .card .ef .trade .coin, .card .ef .per .coin { width: 13px; height: 13px; font-size: 8.5px; }
  .card .ef .per .vp { min-width: 13px; height: 13px; font-size: 9px; padding: 0 2px; }
  .card .nm.long { font-size: 7.9px; letter-spacing: -.1px; -webkit-hyphens: manual; hyphens: manual; overflow-wrap: normal; }
  .card .ch, .card .fr { font-size: 10.5px; padding: 2px 6px; color: #444; }
  .card.brown .band { background: var(--c-brown); } .card.brown { border-color: #6d4625; background: #eadfcf; }
  .card.grey .band { background: var(--c-grey); } .card.grey { border-color: #6c7180; background: #e7e8ec; }
  .card.blue .band { background: var(--c-blue); } .card.blue { border-color: #2c5fa3; background: #dde8f7; }
  .card.yellow .band { background: var(--c-yellow); } .card.yellow { border-color: #b58a20; background: #f7edcf; }
  .card.red .band { background: var(--c-red); } .card.red { border-color: #9d342c; background: #f5dcd8; }
  .card.green .band { background: var(--c-green); } .card.green { border-color: #2a7144; background: #dcefe1; }
  .card.purple .band { background: var(--c-purple); } .card.purple { border-color: #643e8c; background: #e9def3; }
  .card.sel { transform: translateY(-8px); outline-color: var(--accent-warm); box-shadow: 0 10px 18px rgba(0,0,0,.55), 0 0 14px rgba(240,179,84,.45); }
  .card.dim { filter: saturate(.35) brightness(.72); }
  .card.dim.sel { filter: saturate(.6) brightness(.9); }
  .card.hint::after { content: ""; position: absolute; right: 2px; top: 21px; z-index: 1; width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 6px var(--good); }
  .card .val { position: absolute; left: 0; right: 0; bottom: 0; font-size: 9.5px; font-weight: 800; text-align: center; background: rgba(15,17,23,.82); line-height: 14px; }
  .card .st { position: absolute; right: 1px; bottom: 15px; font-size: 8px; font-weight: 800; background: #fff; color: #333; border-radius: 3px; padding: 0 2px; }
  .card.big { width: 150px; height: 200px; border-radius: 12px; cursor: default; }
  .card.big .band { height: 30px; padding: 0 6px; }
  .card.big .cst .ic.s { width: 18px; height: 18px; }
  .card.big .cst .coin { width: 18px; height: 18px; font-size: 11px; }
  .card.big .nm { font-size: 15px; min-height: 36px; }
  .card.big .ef .ic { width: 26px; height: 26px; }
  .card.big .ef .coin { width: 24px; height: 24px; font-size: 13px; }
  .card.big .ef .vp { min-width: 24px; height: 24px; font-size: 14px; }
  @keyframes deal { from { transform: translateY(24px) scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .deal { animation: deal .3s ease-out both; }
  .popin { animation: pop .3s ease-out both; }

  /* ------------------------------------------------ game: phone */
  /* the hand takes the spare height; the action panel has a fixed height so picking a card never moves anything */
  #game { flex: 1; min-height: 0; display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto auto minmax(0, 1fr) auto;
    grid-template-areas: "status" "nb" "me" "hand" "act"; }
  .status { grid-area: status; display: flex; gap: 4px; align-items: center; min-width: 0; }
  .chip { display: inline-flex; align-items: center; gap: 3px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 3px 5px; font-size: 12.5px; white-space: nowrap; }
  .status .chip { min-height: 34px; font-size: 13.5px; }
  .chip .coin, .chip .ic { width: 14px; height: 14px; }
  .status .chip .coin, .status .chip .ic { width: 16px; height: 16px; }
  .chip b { font-variant-numeric: tabular-nums; }
  .icon-btn { width: 36px; height: 38px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; padding: 0;
    transition: transform .08s, background .12s; }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn svg { width: 19px; height: 19px; }
  .nbs { grid-area: nb; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .nb { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 5px 7px; min-width: 0; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
  .nb .t { display: flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; }
  .nb .t .nmx { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .nb .r { display: flex; align-items: center; gap: 3px; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; min-height: 16px; }
  .nb .r .ic { width: 15px; height: 15px; }
  .nb .r .coin { margin-left: 5px; }
  .nb .r > span:not(.coin) { margin-left: 4px; }
  .nb .last { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nb .last b { color: var(--text); font-weight: 650; }
  .me { grid-area: me; background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--accent-warm); border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; min-width: 0; cursor: pointer; }
  .wrow { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .wrow .emb { width: 40px; height: 32px; flex: none; border-radius: 5px; }
  .stages { display: flex; gap: 3px; flex: 1; min-width: 0; }
  .stg { flex: 1; min-width: 0; height: 32px; border-radius: 6px; border: 1px dashed #4a5268; display: flex; align-items: center; justify-content: center; gap: 1px; padding: 0 2px; overflow: hidden; background: var(--bg-soft); }
  .stg.built { border: 1px solid #c9a54a; background: linear-gradient(180deg, rgba(240,179,84,.28), rgba(240,179,84,.12)); }
  .stg.next { border-style: solid; border-color: var(--accent); background: rgba(110,168,254,.08); }
  .stg .ic.s { width: 13px; height: 13px; }
  .stg.tight .ic.s { width: 10px; height: 10px; }
  .stg b.arr { color: var(--muted); font-size: 12px; margin: 0 1px; }
  .stg .ic { width: 15px; height: 15px; }
  .stg .alt .ic.s { width: 10px; height: 10px; }
  .stg .vp, .stg .coin { transform: scale(.9); }
  .stg .tag { font-size: 9.5px; color: var(--text); background: rgba(255,255,255,.08); white-space: normal; line-height: 1.05; text-align: center; }
  .resrow { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-size: 12px; min-height: 18px; }
  .resrow span.g { display: inline-flex; align-items: center; gap: 1px; }
  .resrow .alt b { color: var(--muted); }
  .cols { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; }
  .cols .cc { display: inline-flex; align-items: center; justify-content: center; min-width: 19px; height: 16px; border-radius: 3px; font-size: 10.5px; font-weight: 800; color: #fff; padding: 0 3px; }
  /* first/last auto margins centre the hand but keep every card reachable when it overflows */
  .hand { grid-area: hand; display: flex; gap: 3px; padding: 10px 1px 2px; justify-content: flex-start; min-height: 0; align-items: flex-end; overflow-x: auto; overflow-y: hidden; }
  .hand > :first-child { margin-left: auto; } .hand > :last-child { margin-right: auto; }
  .hand > .card { flex: 1 1 0; max-width: 66px; min-width: 45px; width: auto; }
  .hand .card { height: min(100%, 200px); }
  .hand > .row { height: 100%; }
  .hand > .wpick { align-self: center; }
  .act { grid-area: act; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 5px; height: 180px; min-height: 0; overflow: hidden; }
  .act .btns { margin-top: auto; }
  .act:has(.pays) .odds { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .act .head { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .act .head b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .act .tx { font-size: 12.5px; color: var(--muted); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .act .btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .act .btns .btn { flex-direction: column; gap: 0; min-height: 46px; padding: 0 4px; font-size: 14px; line-height: 1.15; }
  .act .odds { font-size: 12px; color: var(--muted); line-height: 1.35; }
  .act .odds b { color: var(--text); }
  .pays { display: flex; gap: 5px; flex-wrap: wrap; }
  .pays button { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; font-size: 12.5px; cursor: pointer; }
  .pays button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .wait { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px; }
  .dots i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 3px; animation: blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
  #g-side { display: none; }

  /* ------------------------------------------------ game: laptop */
  @media (min-width: 900px) {
    #game { grid-template-columns: 300px minmax(0, 1fr) 270px; grid-template-rows: auto auto auto auto minmax(0, 1fr);
      grid-template-areas: "status status status" "all nb side" "all me side" "all hand side" "all act side"; gap: 10px; }
    #g-all { grid-area: all; display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow-y: auto; }
    #g-side { grid-area: side; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    .hand { gap: 6px; padding-top: 12px; }
    .hand > .card { flex: 0 1 88px; max-width: 88px; min-width: 56px; }
    .hand .card { height: 156px; }
    .hand .card .band { height: 24px; }
    .hand .card .cst .ic.s { width: 15px; height: 15px; }
    .hand .card .cst .coin { width: 15px; height: 15px; }
    .hand .card .nm { font-size: 12px; min-height: 32px; }
    .hand .card .nm.long { font-size: 10.5px; }
    .hand .card .ef .ic, .hand .card .ef .coin { width: 26px; height: 26px; }
    .hand .card .ef .coin { font-size: 14px; }
    .hand .card .ef .vp { min-width: 26px; height: 26px; font-size: 15px; }
    .hand .card .ef .trade .ic, .hand .card .ef .per .ic, .hand .card .ef .alt .ic { width: 17px; height: 17px; }
    .hand .card .val { font-size: 11.5px; line-height: 18px; }
    .hand .card .st { font-size: 10px; bottom: 19px; padding: 0 3px; }
    .hand .card.hint::after { top: 28px; }
    .stg { height: 36px; }
    .wrow .emb { width: 46px; height: 37px; }
    .act { height: auto; min-height: 168px; align-self: start; padding: 12px; gap: 8px; }
    .act .head b { font-size: 17px; }
    .act .tx { -webkit-line-clamp: 3; font-size: 14px; }
    .act .odds { font-size: 13px; }
    .act .btns .btn { min-height: 54px; font-size: 15.5px; }
    .icon-btn { width: 40px; height: 38px; }
    #btn-all, #btn-log { display: none; }
  }
  #g-all { display: none; }
  @media (min-width: 900px) { #g-all { display: flex; } }
  .prow { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; }
  .prow.mine { border-left: 3px solid var(--accent-warm); }
  .prow .t { display: flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 700; }
  .prow .t .nmx { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .citycards { display: flex; flex-wrap: wrap; gap: 2px; }
  .mc { font-size: 10.5px; padding: 1px 5px; border-radius: 4px; color: #fff; white-space: nowrap; font-weight: 650; }
  .mc.new { animation: pop .4s ease-out both; box-shadow: 0 0 0 2px var(--accent-warm); }
  ul.log { list-style: none; margin: 0; padding: 0; font-size: 12.5px; display: flex; flex-direction: column; gap: 3px; }
  ul.log li { color: var(--muted); }
  ul.log li b { color: var(--text); font-weight: 650; }
  ul.log li.h { color: var(--accent); font-weight: 700; margin-top: 4px; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; }

  /* ------------------------------------------------ end of game */
  table.sc { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  table.sc th, table.sc td { padding: 4px 4px; text-align: right; border-top: 1px solid #222838; white-space: nowrap; }
  table.sc th:first-child, table.sc td:first-child { text-align: left; }
  table.sc thead th { color: var(--muted); font-weight: 650; font-size: 11.5px; border-top: 0; max-width: 64px; overflow: hidden; text-overflow: ellipsis; }
  table.sc tr.tot td { font-weight: 800; font-size: 14.5px; }
  table.sc td.win { color: var(--accent-warm); }
  table.sc .rowl { display: inline-flex; align-items: center; gap: 5px; }

  /* ------------------------------------------------ sheets + dialogs */
  .sheet-back { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s; }
  .sheet { width: 100%; max-width: 560px; max-height: 82dvh; background: var(--card); border: 1px solid var(--line); border-radius: 16px 16px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; animation: up .22s ease-out; }
  @media (min-width: 900px) { .sheet-back { align-items: center; } .sheet { border-radius: 16px; max-width: 620px; } }
  @keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .sheet h3 { margin: 0; font-size: 16px; }
  .confirm-back { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .confirm-back .panel { max-width: 360px; width: 100%; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + 14px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #2a3042; padding: 9px 14px; border-radius: 10px; font-size: 13.5px; z-index: 80; animation: up .2s; max-width: calc(100vw - 32px); }
  @media (min-width: 900px) { .toast { bottom: 24px; } }
  .board { display: flex; flex-direction: column; gap: 6px; }
  .board .bs { display: flex; gap: 4px; }
  .board .bs .stg { height: auto; min-height: 44px; flex-direction: column; gap: 2px; padding: 3px; }
  .board .bs .stg .cost { display: flex; gap: 1px; }

  /* ------------------------------------------------ setup / online */
  .setup { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; max-width: 720px; width: 100%; margin: 0 auto; }
  .hero { display: flex; align-items: center; gap: 12px; }
  .hero svg { width: 46px; height: 46px; flex: none; }
  .hero h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
  .hero p { margin: 0; color: var(--muted); font-size: 13px; }
  .setup .panel { display: flex; flex-direction: column; gap: 9px; }
  .code-big { font-size: 38px; font-weight: 800; letter-spacing: .2em; padding-left: .2em; color: var(--accent-warm); font-variant-numeric: tabular-nums; }
  .seats { display: flex; flex-direction: column; gap: 5px; }
  .seatrow { display: flex; align-items: center; gap: 9px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px 4px 10px; font-size: 14px; min-height: 40px; }
  .wpick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .wpick .panel { cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
  .wpick .panel:hover { border-color: var(--accent); }

  /* ------------------------------------------------ score / odds / study / settings */
  .page { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; max-width: 1100px; width: 100%; margin: 0 auto; }
  .sgrid { overflow: auto; min-height: 0; flex: 1; }
  table.calc { border-collapse: separate; border-spacing: 0; font-size: 13px; font-variant-numeric: tabular-nums; }
  table.calc th, table.calc td { padding: 2px 2px; text-align: center; }
  table.calc th:first-child, table.calc td:first-child { text-align: left; position: sticky; left: 0; background: var(--card); z-index: 1; padding-right: 4px; white-space: nowrap; }
  table.calc input { width: 42px; height: 33px; text-align: center; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 6px; font-size: 15px; padding: 0; color: var(--text); -moz-appearance: textfield; }
  table.calc input::-webkit-outer-spin-button, table.calc input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  table.calc input.nm { width: 54px; font-size: 12px; }
  table.calc td.out { font-weight: 750; color: var(--muted); font-size: 12.5px; }
  table.calc tr.tot td { font-weight: 850; font-size: 16px; color: var(--text); padding-top: 6px; }
  table.calc tr.sub td:first-child { padding-left: 14px; color: var(--muted); }
  .tabs2 { display: flex; gap: 6px; overflow-x: auto; flex: none; }
  .tabs2 button { flex: 1; min-height: 36px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 9px; cursor: pointer; font-weight: 650; font-size: 13.5px; padding: 0 10px; white-space: nowrap; }
  .tabs2 button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: rgba(110,168,254,.12); }
  table.dt { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  table.dt th { text-align: right; color: var(--muted); font-weight: 650; font-size: 11.5px; padding: 3px 4px; position: sticky; top: 0; background: var(--card); cursor: pointer; }
  table.dt td { text-align: right; padding: 4px 4px; border-top: 1px solid #222838; }
  table.dt th:first-child, table.dt td:first-child { text-align: left; }
  .stepper { display: inline-flex; align-items: center; gap: 4px; }
  .stepper button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-soft); cursor: pointer; font-size: 18px; font-weight: 700; }
  .stepper b { min-width: 22px; text-align: center; font-size: 17px; font-variant-numeric: tabular-nums; }
  .twocol { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  @media (min-width: 900px) { .twocol { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
  .bigval { font-size: 30px; font-weight: 850; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: var(--bg-soft); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .set { max-width: 640px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .setrow { display: flex; align-items: center; gap: 10px; min-height: 46px; }
  .setrow .grow b { display: block; font-weight: 650; }
  .setrow .grow span { display: block; font-size: 12.5px; line-height: 1.35; color: var(--muted); }
  @media (min-width: 900px) {
    .sgrid { flex: 0 1 auto; align-self: center; width: auto; max-width: 100%; padding: 12px 16px !important; }
    table.calc { font-size: 14px; }
    table.calc th, table.calc td { padding: 3px 4px; }
    table.calc input { width: 64px; height: 36px; font-size: 16px; }
    table.calc input.nm { width: 72px; font-size: 13px; }
    #v-odds .page { max-width: 860px; }
    #v-score .page { max-width: 580px; }
  }
  .ver { color: #59607a; font-size: 12px; text-align: center; }
  .ver a { color: #59607a; }
  .ok { color: var(--good); font-weight: 700; }
  .no { color: var(--bad); font-weight: 700; }
  @media (max-width: 360px) { .card { width: 45px; } .card .nm { font-size: 8.5px; } }

  /* ------------------------------------------------ sound & effects (js/fx.js settings) */
  .mc.new { animation-delay: var(--land, 0ms); }
  body.fx-fast .deal, body.fx-fast .popin, body.fx-fast .mc.new { animation-duration: .17s; }
  body.fx-noanim .deal, body.fx-noanim .popin, body.fx-noanim .mc.new, body.fx-noanim .sheet, body.fx-noanim .sheet-back, body.fx-noanim .toast { animation: none; }
  #fx-panel .fx-set { margin-top: 4px; }
  #fx-panel .fx-row { border-top: 0; padding: 0; min-height: 46px; gap: 10px; }
  #fx-panel .fx-lab { font-weight: 650; }
  #fx-panel .fx-row.dim { opacity: .45; }
  #fx-panel .fx-vol { flex: 0 1 160px; min-width: 80px; accent-color: var(--accent); }
  #fx-panel .fx-test { min-height: 34px; padding: 0 11px; font-size: 13.5px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-soft); font-weight: 650; cursor: pointer; }
  #fx-panel .fx-row .seg { flex: none; background: none; border: 0; padding: 0; gap: 6px; }
  #fx-panel .fx-row .seg button { min-height: 36px; font-size: 13px; padding: 3px 12px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; color: var(--text); }
  #fx-panel .fx-row .seg button[aria-pressed="true"] { background: rgba(110,168,254,.14); border-color: var(--accent); color: var(--accent); }
  /* the game's own switch look (fx.js brings a green one) */
  #fx-panel .switch { width: 48px; height: 28px; }
  #fx-panel .switch span { background: #2f3548; border-radius: 14px; }
  #fx-panel .switch span::after { width: 22px; height: 22px; }
  #fx-panel .switch input:checked + span { background: var(--accent); }
  #fx-panel .switch input:checked + span::after { transform: translateX(20px); }
  #fx-panel .fx-why { font-size: 12.5px; color: var(--muted); padding: 0 0 8px; }
</style>
